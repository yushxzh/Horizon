theme: jekyll-theme-cayman
title: 每日资讯简报
description: 每天更新的 AI、软件工程、开源工具与安全资讯
lang: zh-CN
baseurl: "/Horizon"
url: "https://yushxzh.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
